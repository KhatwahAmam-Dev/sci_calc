<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-CALC // Scientific & Bio-Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 128, 0.08) 0px, transparent 50%);
        }
        .font-digital {
            font-family: 'Orbitron', monospace;
        }
        /* Futuristic Glow & Glassmorphism */
        .cyber-glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .cyber-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cyber-btn:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            transform: translateY(-1px);
        }
        .cyber-btn:active {
            transform: scale(0.94);
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.6);
        }
        .cyber-btn-op {
            background: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .cyber-btn-sci {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(192, 132, 252, 0.3);
        }
        .cyber-btn-action {
            background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
            color: #090d16;
            font-weight: 800;
        }
        .cyber-btn-action:hover {
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.7);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-3 md:p-6">

    <div class="w-full max-w-md space-y-4">
        
        <!-- Header Mode Selector -->
        <div class="cyber-glass rounded-2xl p-2 flex gap-2 text-xs font-bold font-digital">
            <button id="btnTabSci" onclick="switchTab('sci')" class="flex-1 py-2 rounded-xl transition bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 shadow-[0_0_10px_rgba(0,240,255,0.2)]">
                ⚡ SCIENTIFIC
            </button>
            <button id="btnTabBio" onclick="switchTab('bio')" class="flex-1 py-2 rounded-xl transition text-slate-400 hover:text-cyan-300">
                🧬 BIO-HEALTH (BMI)
            </button>
        </div>

        <!-- PANEL 1: SCIENTIFIC CALCULATOR -->
        <div id="panelSci" class="cyber-glass rounded-2xl p-4 space-y-4">
            
            <!-- LCD Display Screen -->
            <div class="bg-slate-950/90 rounded-xl p-4 border border-cyan-500/30 shadow-inner relative overflow-hidden">
                <div class="absolute top-2 right-3 text-[10px] font-digital text-cyan-500/60 tracking-widest flex gap-2">
                    <span id="degRadIndicator" class="text-cyan-400">DEG</span>
                    <span>CYBER-CORE v1.0</span>
                </div>
                <div id="sciHistory" class="text-right text-xs text-slate-500 font-digital h-4 overflow-hidden mt-3"></div>
                <div id="sciDisplay" class="text-right text-2xl md:text-3xl font-digital text-cyan-400 font-extrabold tracking-wider mt-1 truncate drop-shadow-[0_0_8px_rgba(0,240,255,0.5)]">
                    0
                </div>
            </div>

            <!-- Scientific Controls -->
            <div class="grid grid-cols-5 gap-2 text-xs font-bold font-digital">
                <button onclick="toggleDegRad()" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">DEG</button>
                <button onclick="inputSci('sin(')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">SIN</button>
                <button onclick="inputSci('cos(')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">COS</button>
                <button onclick="inputSci('tan(')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">TAN</button>
                <button onclick="clearSci()" class="cyber-btn bg-rose-500/20 text-rose-400 border-rose-500/40 py-2.5 rounded-lg">AC</button>

                <button onclick="inputSci('π')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">π</button>
                <button onclick="inputSci('log(')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">LOG</button>
                <button onclick="inputSci('ln(')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">LN</button>
                <button onclick="inputSci('√(')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">√</button>
                <button onclick="deleteSci()" class="cyber-btn bg-amber-500/20 text-amber-400 border-amber-500/40 py-2.5 rounded-lg">DEL</button>

                <button onclick="inputSci('^')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">x^y</button>
                <button onclick="inputSci('(')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">(</button>
                <button onclick="inputSci(')')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">)</button>
                <button onclick="inputSci('%')" class="cyber-btn cyber-btn-sci py-2.5 rounded-lg">%</button>
                <button onclick="inputSci('/')" class="cyber-btn cyber-btn-op py-2.5 rounded-lg">÷</button>

                <!-- Numpad Keypad -->
                <button onclick="inputSci('7')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">7</button>
                <button onclick="inputSci('8')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">8</button>
                <button onclick="inputSci('9')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">9</button>
                <button onclick="inputSci('*')" class="cyber-btn cyber-btn-op py-3.5 rounded-xl text-base font-digital">×</button>
                <button onclick="inputSci('e')" class="cyber-btn cyber-btn-sci py-3.5 rounded-xl text-xs font-digital">e</button>

                <button onclick="inputSci('4')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">4</button>
                <button onclick="inputSci('5')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">5</button>
                <button onclick="inputSci('6')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">6</button>
                <button onclick="inputSci('-')" class="cyber-btn cyber-btn-op py-3.5 rounded-xl text-base font-digital">-</button>
                <button onclick="switchTab('bio')" class="cyber-btn bg-pink-500/20 text-pink-400 border-pink-500/30 py-3.5 rounded-xl text-[10px] font-digital leading-tight">BMI CALC</button>

                <button onclick="inputSci('1')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">1</button>
                <button onclick="inputSci('2')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">2</button>
                <button onclick="inputSci('3')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">3</button>
                <button onclick="inputSci('+')" class="cyber-btn cyber-btn-op py-3.5 rounded-xl text-base font-digital">+</button>
                <button onclick="calculateSci()" class="row-span-2 cyber-btn cyber-btn-action rounded-xl flex items-center justify-center text-xl font-digital shadow-lg">=</button>

                <button onclick="inputSci('0')" class="col-span-2 cyber-btn py-3.5 rounded-xl text-base font-digital">0</button>
                <button onclick="inputSci('.')" class="cyber-btn py-3.5 rounded-xl text-base font-digital">.</button>
                <button onclick="inputSci('00')" class="cyber-btn py-3.5 rounded-xl text-xs font-digital">00</button>
            </div>
        </div>

        <!-- PANEL 2: BIO-HEALTH / BMI CALCULATOR -->
        <div id="panelBio" class="cyber-glass rounded-2xl p-5 space-y-4 hidden">
            
            <div class="border-b border-slate-700/60 pb-2">
                <h2 class="text-sm font-bold font-digital text-cyan-400 tracking-wider">🧬 ANALISIS MASA TUBUH &amp; IDEAL</h2>
                <p class="text-xs text-slate-400">Kalkulator bio-metrik berbasis standar WHO Asia-Pasifik &amp; Broca.</p>
            </div>

            <!-- Input Form -->
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-300 mb-1">BERAT BADAN (KG)</label>
                    <input type="number" id="bioWeight" value="75" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl p-3 font-digital text-cyan-300 focus:border-cyan-400 focus:outline-none text-base">
                </div>
                <div>
                    <label class="block font-bold text-slate-300 mb-1">TINGGI BADAN (CM)</label>
                    <input type="number" id="bioHeight" value="155" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl p-3 font-digital text-cyan-300 focus:border-cyan-400 focus:outline-none text-base">
                </div>
            </div>

            <button onclick="calculateBio()" class="w-full cyber-btn cyber-btn-action py-3 rounded-xl font-digital text-xs tracking-widest uppercase">
                🔍 JALANKAN DIAGNOSA BIO-HEALTH
            </button>

            <!-- Output Result Card -->
            <div id="bioResult" class="space-y-3 pt-2">
                <!-- Result dynamically rendered -->
            </div>

        </div>

    </div>

    <script>
        // --- TAB SWITCHER ---
        function switchTab(tab) {
            const sciPanel = document.getElementById('panelSci');
            const bioPanel = document.getElementById('panelBio');
            const btnSci = document.getElementById('btnTabSci');
            const btnBio = document.getElementById('btnTabBio');

            if (tab === 'sci') {
                sciPanel.classList.remove('hidden');
                bioPanel.classList.add('hidden');
                btnSci.className = "flex-1 py-2 rounded-xl transition bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 shadow-[0_0_10px_rgba(0,240,255,0.2)]";
                btnBio.className = "flex-1 py-2 rounded-xl transition text-slate-400 hover:text-cyan-300";
            } else {
                sciPanel.classList.add('hidden');
                bioPanel.classList.remove('hidden');
                btnBio.className = "flex-1 py-2 rounded-xl transition bg-pink-500/20 text-pink-400 border border-pink-500/40 shadow-[0_0_10px_rgba(255,0,128,0.2)]";
                btnSci.className = "flex-1 py-2 rounded-xl transition text-slate-400 hover:text-cyan-300";
                calculateBio(); // Auto run on switch
            }
        }

        // --- SCIENTIFIC CALCULATOR LOGIC ---
        let sciExpression = "";
        let isDegree = true;

        function toggleDegRad() {
            isDegree = !isDegree;
            document.getElementById('degRadIndicator').innerText = isDegree ? "DEG" : "RAD";
        }

        function inputSci(val) {
            const display = document.getElementById('sciDisplay');
            if (display.innerText === "0" || display.innerText === "ERROR") {
                sciExpression = "";
            }
            sciExpression += val;
            display.innerText = sciExpression;
        }

        function clearSci() {
            sciExpression = "";
            document.getElementById('sciDisplay').innerText = "0";
            document.getElementById('sciHistory').innerText = "";
        }

        function deleteSci() {
            sciExpression = sciExpression.slice(0, -1);
            document.getElementById('sciDisplay').innerText = sciExpression || "0";
        }

        function calculateSci() {
            const history = document.getElementById('sciHistory');
            const display = document.getElementById('sciDisplay');

            try {
                history.innerText = sciExpression + " =";
                let expr = sciExpression
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/√\(/g, 'Math.sqrt(')
                    .replace(/\^/g, '**')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(');

                // Handle Trigonometry DEG vs RAD
                if (isDegree) {
                    expr = expr.replace(/sin\((.*?)\)/g, (m, g1) => `Math.sin((${g1}) * Math.PI / 180)`);
                    expr = expr.replace(/cos\((.*?)\)/g, (m, g1) => `Math.cos((${g1}) * Math.PI / 180)`);
                    expr = expr.replace(/tan\((.*?)\)/g, (m, g1) => `Math.tan((${g1}) * Math.PI / 180)`);
                } else {
                    expr = expr.replace(/sin\(/g, 'Math.sin(')
                               .replace(/cos\(/g, 'Math.cos(')
                               .replace(/tan\(/g, 'Math.tan(');
                }

                let result = eval(expr);
                if (typeof result === 'number' && !isNaN(result)) {
                    // Format precision
                    result = Number(result.toFixed(8));
                    display.innerText = result;
                    sciExpression = String(result);
                } else {
                    display.innerText = "ERROR";
                }
            } catch (e) {
                display.innerText = "ERROR";
            }
        }

        // --- BIO-HEALTH (BMI) LOGIC ---
        function calculateBio() {
            const weight = parseFloat(document.getElementById('bioWeight').value) || 0;
            const height = parseFloat(document.getElementById('bioHeight').value) || 0;
            const resultDiv = document.getElementById('bioResult');

            if (weight <= 0 || height <= 0) {
                resultDiv.innerHTML = `<div class="p-3 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-xl text-xs">Masukkan nilai Berat & Tinggi yang valid.</div>`;
                return;
            }

            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);

            // Broca Ideal Weight formula
            let idealWeight = 0;
            if (height < 160) {
                idealWeight = (height - 100) - ((height - 100) * 0.10);
            } else {
                idealWeight = (height - 100) - ((height - 100) * 0.10);
            }

            // Ideal BMI Range (18.5 - 22.9)
            const minIdealWeight = 18.5 * (heightM * heightM);
            const maxIdealWeight = 22.9 * (heightM * heightM);

            // Category determination (WHO Asia-Pacific)
            let status = "";
            let statusColor = "";
            let badgeBg = "";

            if (bmi < 18.5) {
                status = "KURUS (UNDERWEIGHT)";
                statusColor = "text-amber-400";
                badgeBg = "bg-amber-500/20 border-amber-500/40";
            } else if (bmi <= 22.9) {
                status = "IDEAL / SEHAT (NORMAL)";
                statusColor = "text-emerald-400";
                badgeBg = "bg-emerald-500/20 border-emerald-500/40";
            } else if (bmi <= 24.9) {
                status = "KELEBIHAN BERAT (OVERWEIGHT)";
                statusColor = "text-amber-400";
                badgeBg = "bg-amber-500/20 border-amber-500/40";
            } else {
                status = "OBESITAS (OBESE)";
                statusColor = "text-rose-400";
                badgeBg = "bg-rose-500/20 border-rose-500/40";
            }

            resultDiv.innerHTML = `
                <div class="p-4 rounded-xl border ${badgeBg} space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] font-digital text-slate-400">SKOR BMI (IMT)</span>
                        <span class="text-xl font-bold font-digital ${statusColor}">${bmi.toFixed(2)}</span>
                    </div>
                    <div class="text-xs font-bold ${statusColor} tracking-wide border-t border-slate-700/50 pt-2">
                        STATUS: ${status}
                    </div>
                </div>

                <div class="p-4 bg-slate-950/80 border border-cyan-500/20 rounded-xl space-y-2 text-xs">
                    <div class="font-bold text-cyan-400 font-digital border-b border-slate-800 pb-1">🎯 ANISA &amp; TARGET BERAT IDEAL</div>
                    <div class="flex justify-between text-slate-300">
                        <span>Target Ideal (Rumus Broca):</span>
                        <strong class="text-cyan-300 font-digital">${idealWeight.toFixed(1)} kg</strong>
                    </div>
                    <div class="flex justify-between text-slate-300">
                        <span>Rentang Sehat (BMI 18.5-22.9):</span>
                        <strong class="text-emerald-400 font-digital">${minIdealWeight.toFixed(1)} - ${maxIdealWeight.toFixed(1)} kg</strong>
                    </div>
                </div>

                <div class="p-3 bg-slate-900/60 border border-slate-800 rounded-xl text-[11px] text-slate-400 space-y-1">
                    <strong class="text-slate-300">📐 Cara Perhitungan Rumus:</strong>
                    <p>• <strong>BMI</strong> = ${weight} / (${heightM}²) = <strong>${bmi.toFixed(2)}</strong></p>
                    <p>• <strong>Broca</strong> = (${height} - 100) - 10% = <strong>${idealWeight.toFixed(1)} kg</strong></p>
                </div>
            `;
        }
    </script>
</body>
</html>
